<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Product Listing - PlayStation Legacy</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <!-- admin header & nav -->
    <header class="admin-navbar">
        <a href="index.html" class="logo">
            <img src="images/spinningplaystation.gif" alt="PlayStation Legacy Logo">
        </a>
        <nav>
            <a href="admin-upload.html">Bulk Upload</a>
            <a href="admin-products.html">Product Listing</a>
            <a href="logout.html">Sign Out</a>
        </nav>
    </header>

    <div class="admin-container">
        <h1>Product Listing</h1>
        
        <input type="text" id="search" placeholder="Search products..." onkeyup="filterProducts()">
        
        <table id="product-list">
            <thead>
                <tr>
                    <th>Product ID</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- where products will be dynamically inserted -->
            </tbody>
        </table>

        <button id="add-product-btn" onclick="location.href='product-edit.html'">Add New Product</button>
    </div>

    <script>
        // example data
        const products = [
            { id: 1, name: 'Game 1', description: 'Description 1', category: 'Action', price: '$59.99' },
            { id: 2, name: 'Game 2', description: 'Description 2', category: 'Adventure', price: '$49.99' },
            { id: 3, name: 'Game 3', description: 'Description 3', category: 'RPG', price: '$69.99' }
        ];

        function renderProducts(products) {
            const tbody = document.querySelector("#product-list tbody");
            tbody.innerHTML = "";  // Clear existing rows
            products.forEach(product => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${product.id}</td>
                    <td>${product.name}</td>
                    <td>${product.description}</td>
                    <td>${product.category}</td>
                    <td>${product.price}</td>
                    <td>
                        <button onclick="editProduct(${product.id})">Edit</button>
                        <button onclick="deleteProduct(${product.id})">Delete</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function filterProducts() {
            const searchQuery = document.getElementById("search").value.toLowerCase();
            const filteredProducts = products.filter(product => 
                product.name.toLowerCase().includes(searchQuery) ||
                product.category.toLowerCase().includes(searchQuery)
            );
            renderProducts(filteredProducts);
        }

        function editProduct(productId) {
            // redirect
            location.href = `product-edit.html?id=${productId}`;
        }

        function deleteProduct(productId) {
           
            alert(`Product ${productId} deleted`);
        
        }

       
        renderProducts(products);
    </script>
</body>
</html>
